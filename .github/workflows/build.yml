name: Build PhantomGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PhantomGram
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "arm64-v8a"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Point Chaquopy at Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Configure local.properties and keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          echo "APP_ID=${APP_ID}" >> local.properties
          echo "APP_HASH=${APP_HASH}" >> local.properties
          echo "API_ID=${APP_ID}" >> local.properties
          echo "API_HASH=${APP_HASH}" >> local.properties

      - name: Modify Gradle JVM Args
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build Staging APK
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          API_ID: ${{ secrets.APP_ID }}
          API_HASH: ${{ secrets.APP_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew TMessagesProj:assembleStaging --no-daemon --stacktrace

      - name: Upload PhantomGram APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomGram-APK
          path: TMessagesProj/build/outputs/apk/staging/*.apk
